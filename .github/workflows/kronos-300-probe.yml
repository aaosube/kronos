name: Kronos TSLA data coverage probe
on:
  push:
    branches: ['audit/tsla-300x24h-20260920']
    paths: ['.github/workflows/kronos-300-probe.yml']
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet yfinance pandas numpy pandas_market_calendars
      - name: Inspect actual intraday coverage
        shell: bash
        run: |
          mkdir -p evidence
          python - <<'PY'
          import json,hashlib
          import pandas as pd,numpy as np,yfinance as yf
          import pandas_market_calendars as mcal
          d=yf.download('TSLA',start='2024-09-23',end='2026-09-19',interval='1h',prepost=True,auto_adjust=False,actions=True,progress=False,threads=False)
          if d.empty:raise RuntimeError('No hourly TSLA data')
          if isinstance(d.columns,pd.MultiIndex):d.columns=d.columns.get_level_values(0)
          d.index=pd.to_datetime(d.index).tz_convert('America/New_York');d.index.name='timestamp'
          d.to_csv('evidence/TSLA_1h_extended_raw.csv')
          cal=mcal.get_calendar('NYSE').schedule(start_date='2024-09-23',end_date='2026-09-18')
          full=cal[(cal.market_close-cal.market_open)==pd.Timedelta(hours=6.5)]
          dates=set(full.index.strftime('%Y-%m-%d'))
          pairs=[]
          for ds in sorted(dates):
            end=pd.Timestamp(ds+' 16:00',tz='America/New_York');start=end-pd.Timedelta(hours=24)
            if str(start.date()) not in dates:continue
            h=d.loc[d.index<start];y=d.loc[(d.index>=start)&(d.index<end)]
            if len(h)>=400 and len(y):pairs.append((ds,len(y),str(start),str(end)))
          report={'rows':len(d),'first':str(d.index[0]),'last':str(d.index[-1]),'columns':list(d.columns),'sample_date_bins':{},'duplicate_times':int(d.index.duplicated().sum()),'n_exact_24h_pairs_with_context400':len(pairs),'last_300_start':pairs[-300] if len(pairs)>=300 else None,'pair_lengths':pd.Series([p[1] for p in pairs]).value_counts().to_dict(),'last_300_after_weight_release':sum(pd.Timestamp(p[0])>=pd.Timestamp('2025-07-02') for p in pairs[-300:]),'raw_sha256':hashlib.sha256(open('evidence/TSLA_1h_extended_raw.csv','rb').read()).hexdigest()}
          for ds in ['2024-09-24','2025-04-01','2026-09-17','2026-09-18']:
            g=d.loc[d.index.strftime('%Y-%m-%d')==ds]
            report['sample_date_bins'][ds]=[{'t':str(t),'open':float(r.Open),'close':float(r.Close),'volume':float(r.Volume)} for t,r in g.iterrows()]
          open('evidence/coverage.json','w').write(json.dumps(report,indent=2,default=str))
          print('COVERAGE_RESULT='+json.dumps(report,default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsla-coverage-evidence
          path: evidence/
          retention-days: 7
